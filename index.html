<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aravindhan M - Portfolio</title>
    <meta
      name="description"
      content="Portfolio website of Aravindhan M, B.E. Computer Science and Engineering student, aspiring software developer, and hackathon participant."
    />
    <meta property="og:title" content="Aravindhan M - Portfolio" />
    <meta
      property="og:description"
      content="Portfolio website of Aravindhan M, B.E. Computer Science and Engineering student, aspiring software developer, and hackathon participant."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0f1d" />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Initial Theme Detection to prevent theme flash -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('aravindh_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-[#0a0f1d] dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
